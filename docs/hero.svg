<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif">
<title>A change cuts SSH. With plain Ansible the undo is on your Mac and the host stays broken. With ansible-safe-mcp the undo is on the host, and it puts itself back.</title>
<rect x="0.5" y="0.5" width="759" height="289" rx="10" fill="#0d1117" stroke="#30363d" />
<text x="380.0" y="40" font-size="18" fill="#e6edf3" font-weight="600" text-anchor="middle">A change cuts SSH. Who holds the undo?</text>
<text x="28" y="104" font-size="14" fill="#8b949e" font-weight="600" text-anchor="start">Plain Ansible</text>
<rect x="196" y="72" width="150" height="64" rx="8" fill="#161b22" stroke="#30363d" />
<rect x="420" y="72" width="150" height="64" rx="8" fill="#161b22" stroke="#30363d" />
<text x="271.0" y="97" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Your Mac</text>
<text x="495.0" y="97" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Server</text>
<rect x="231" y="107" width="80" height="20" rx="10" fill="#2d1517" stroke="#f85149"/>
<text x="271" y="121.5" font-size="11.5" fill="#f85149" font-weight="600" text-anchor="middle">undo</text>
<line x1="346" y1="104" x2="371.0" y2="104" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="395.0" y1="104" x2="420" y2="104" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M376.0,97 L390.0,111 M390.0,97 L376.0,111" stroke="#f85149" stroke-width="2.6" stroke-linecap="round"/>
<path d="M578,104 L592,104" stroke="#f85149" stroke-width="2"/>
<path d="M586,99 L594,104 L586,109" fill="none" stroke="#f85149" stroke-width="2"/>
<text x="602" y="101" font-size="14" fill="#f85149" font-weight="700" text-anchor="start">stays broken</text>
<text x="602" y="119" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">until you get there</text>
<line x1="28" y1="166" x2="732" y2="166" stroke="#30363d"/>
<text x="28" y="216" font-size="14" fill="#8b949e" font-weight="600" text-anchor="start">ansible-safe-mcp</text>
<rect x="196" y="184" width="150" height="64" rx="8" fill="#161b22" stroke="#30363d" />
<rect x="420" y="184" width="150" height="64" rx="8" fill="#161b22" stroke="#30363d" />
<text x="271.0" y="209" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Your Mac</text>
<text x="495.0" y="209" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Server</text>
<rect x="455" y="219" width="80" height="20" rx="10" fill="#12261a" stroke="#3fb950"/>
<text x="495" y="233.5" font-size="11.5" fill="#3fb950" font-weight="600" text-anchor="middle">⏱ undo</text>
<line x1="346" y1="216" x2="371.0" y2="216" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="395.0" y1="216" x2="420" y2="216" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M376.0,209 L390.0,223 M390.0,209 L376.0,223" stroke="#f85149" stroke-width="2.6" stroke-linecap="round"/>
<path d="M578,216 L592,216" stroke="#3fb950" stroke-width="2"/>
<path d="M586,211 L594,216 L586,221" fill="none" stroke="#3fb950" stroke-width="2"/>
<text x="602" y="213" font-size="14" fill="#3fb950" font-weight="700" text-anchor="start">puts itself back</text>
<text x="602" y="231" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">at the deadline</text>
</svg>