<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" role="img">
<title>A change cuts SSH. With block/rescue the undo waits on the controller and never reaches the host. With ansible-safe-mcp the undo is armed on the host before the change, so the host restores itself at the deadline.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#8b949e" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#3fb950" stroke-width="1.6"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="285" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="42" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="start" >On the host’s clock</text>
<text x="32" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e" font-weight="400" text-anchor="start" >The same change, the same lost connection. Only where the undo lives is different.</text>
<line x1="196" y1="92" x2="196" y2="252" stroke="#30363d" stroke-dasharray="2 4"/>
<text x="196" y="90" font-family="SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" >21:04</text>
<line x1="262" y1="92" x2="262" y2="252" stroke="#30363d" stroke-dasharray="2 4"/>
<text x="262" y="90" font-family="SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" >21:04</text>
<line x1="340" y1="92" x2="340" y2="252" stroke="#30363d" stroke-dasharray="2 4"/>
<text x="340" y="90" font-family="SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" >21:05</text>
<line x1="640" y1="92" x2="640" y2="252" stroke="#30363d" stroke-dasharray="2 4"/>
<text x="640" y="90" font-family="SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" >21:14</text>
<line x1="196" y1="100" x2="640" y2="100" stroke="#30363d"/>
<text x="196" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e" font-weight="500" text-anchor="middle" >arm</text>
<text x="262" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e" font-weight="500" text-anchor="middle" >apply</text>
<text x="340" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e" font-weight="500" text-anchor="middle" >SSH lost</text>
<text x="640" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e" font-weight="500" text-anchor="middle" >deadline</text>
<text x="32" y="164" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" >block / rescue</text>
<text x="32" y="182" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="start" >undo on the controller</text>
<line x1="262" y1="159" x2="340" y2="159" stroke="#e6edf3" stroke-width="2"/>
<circle cx="262" cy="159" r="3.5" fill="#e6edf3"/>
<path d="M335,152 L345,166" stroke="#f0883e" stroke-width="1.6"/>
<line x1="345" y1="159" x2="640" y2="159" stroke="#e6edf3" stroke-width="2" stroke-opacity=".35" stroke-dasharray="6 5"/>
<text x="492" y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e" font-weight="400" text-anchor="middle" >the rescue waits on the controller</text>
<text x="654" y="163.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f0883e" font-weight="600" text-anchor="start" >still changed</text>
<text x="32" y="226" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" >ansible-safe-mcp</text>
<text x="32" y="244" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="start" >undo on the host</text>
<path d="M196,230 v6 H640 v-6" fill="none" stroke="#3fb950" stroke-width="1.2"/>
<text x="418" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3fb950" font-weight="500" text-anchor="middle" >undo armed on the host, 10-minute window</text>
<line x1="262" y1="221" x2="340" y2="221" stroke="#e6edf3" stroke-width="2"/>
<circle cx="262" cy="221" r="3.5" fill="#e6edf3"/>
<path d="M335,214 L345,228" stroke="#f0883e" stroke-width="1.6"/>
<line x1="345" y1="221" x2="640" y2="221" stroke="#e6edf3" stroke-width="2" stroke-opacity=".35"/>
<circle cx="640" cy="221" r="4.5" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
<text x="654" y="225.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#3fb950" font-weight="600" text-anchor="start" >restored</text>
</svg>