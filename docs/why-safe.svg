<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif">
<title>Where the undo lives. With block/rescue the undo waits on your Mac, so a change that cuts SSH leaves the host locked. With ansible-safe-mcp the undo is armed on the host before the change, so the host restores itself at the deadline.</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="451" rx="10" fill="#0d1117" stroke="#30363d" />
<text x="24" y="36" font-size="17" fill="#e6edf3" font-weight="600" text-anchor="start" >Where the undo lives</text>
<text x="24" y="58" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start" >A change cuts SSH. What happens next depends on which side of the cut holds the undo.</text>
<rect x="24" y="78" width="346" height="252" rx="8" fill="#161b22" stroke="#30363d" />
<text x="42" y="104" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="start" >Plain Ansible</text>
<text x="42" y="123" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start" >block / rescue: the rescue runs on the controller</text>
<rect x="42" y="146" width="120" height="92" rx="6" fill="#0d1117" stroke="#30363d" />
<text x="102.0" y="168" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >Your Mac</text>
<text x="102.0" y="185" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >Ansible, Claude</text>
<rect x="232" y="146" width="120" height="92" rx="6" fill="#0d1117" stroke="#30363d" />
<text x="292.0" y="168" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >The host</text>
<text x="292.0" y="185" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >change applied</text>
<rect x="54" y="198" width="96" height="28" rx="14" fill="#2d1517" stroke="#f85149" />
<text x="102.0" y="216" font-size="12" fill="#f85149" font-weight="600" text-anchor="middle" >rescue: undo</text>
<rect x="244" y="198" width="96" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-dasharray="3 3"/>
<text x="292.0" y="216" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle" >no undo here</text>
<line x1="162" y1="192" x2="183.0" y2="192" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="211.0" y1="192" x2="232" y2="192" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M190.0,185 L204.0,199 M204.0,185 L190.0,199" stroke="#f85149" stroke-width="2.6" stroke-linecap="round"/>
<text x="197.0" y="178" font-size="11.5" fill="#f85149" font-weight="600" text-anchor="middle" >SSH cut</text>
<text x="102.0" y="262" font-size="11.5" fill="#f85149" font-weight="600" text-anchor="middle" >↳ never reaches the host</text>
<rect x="36" y="286" width="322" height="34" rx="6" fill="#2d1517"/>
<rect x="36" y="286" width="3" height="34" fill="#f85149"/>
<text x="48" y="300" font-size="11.5" fill="#e6edf3" font-weight="500" text-anchor="start" >The host stays as the change left it:</text>
<text x="48" y="314" font-size="11.5" fill="#e6edf3" font-weight="500" text-anchor="start" >locked, until someone gets to it in person.</text>
<rect x="390" y="78" width="346" height="252" rx="8" fill="#161b22" stroke="#30363d" />
<text x="408" y="104" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="start" >ansible-safe-mcp</text>
<text x="408" y="123" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start" >commit-confirmed: the undo is armed on the host first</text>
<rect x="408" y="146" width="120" height="92" rx="6" fill="#0d1117" stroke="#30363d" />
<text x="468.0" y="168" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >Your Mac</text>
<text x="468.0" y="185" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >Ansible, Claude</text>
<rect x="598" y="146" width="120" height="92" rx="6" fill="#0d1117" stroke="#30363d" />
<text x="658.0" y="168" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >The host</text>
<text x="658.0" y="185" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >change applied</text>
<rect x="420" y="198" width="96" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-dasharray="3 3"/>
<text x="468.0" y="216" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle" >confirm?</text>
<rect x="608" y="198" width="100" height="28" rx="14" fill="#12261a" stroke="#3fb950" />
<text x="658.0" y="216" font-size="12" fill="#3fb950" font-weight="600" text-anchor="middle" >⏱ undo + timer</text>
<line x1="528" y1="192" x2="549.0" y2="192" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="577.0" y1="192" x2="598" y2="192" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M556.0,185 L570.0,199 M570.0,185 L556.0,199" stroke="#f85149" stroke-width="2.6" stroke-linecap="round"/>
<text x="563.0" y="178" font-size="11.5" fill="#f85149" font-weight="600" text-anchor="middle" >SSH cut</text>
<path d="M704,238 C704,268 612,268 612,242" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#ar)"/>
<text x="658.0" y="278" font-size="11.5" fill="#3fb950" font-weight="600" text-anchor="middle" >at the deadline: restore</text>
<rect x="402" y="286" width="322" height="34" rx="6" fill="#12261a"/>
<rect x="402" y="286" width="3" height="34" fill="#3fb950"/>
<text x="414" y="300" font-size="11.5" fill="#e6edf3" font-weight="500" text-anchor="start" >The host restores itself. No one needs to</text>
<text x="414" y="314" font-size="11.5" fill="#e6edf3" font-weight="500" text-anchor="start" >reach it, and your Mac may be asleep.</text>
<text x="24" y="360" font-size="12" fill="#8b949e" font-weight="600" text-anchor="start" >The on-host undo, per kind of host</text>
<rect x="24" y="372" width="134" height="54" rx="6" fill="#161b22" stroke="#30363d" />
<text x="91.0" y="394" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >Linux</text>
<text x="91.0" y="413" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >systemd timer</text>
<rect x="167" y="372" width="134" height="54" rx="6" fill="#161b22" stroke="#30363d" />
<text x="234.0" y="394" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >Windows</text>
<text x="234.0" y="413" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >SYSTEM task</text>
<rect x="310" y="372" width="134" height="54" rx="6" fill="#161b22" stroke="#30363d" />
<text x="377.0" y="394" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >macOS</text>
<text x="377.0" y="413" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >LaunchDaemon</text>
<rect x="453" y="372" width="134" height="54" rx="6" fill="#161b22" stroke="#30363d" />
<text x="520.0" y="394" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >RouterOS</text>
<text x="520.0" y="413" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >Safe Mode</text>
<rect x="596" y="372" width="134" height="54" rx="6" fill="#161b22" stroke="#30363d" />
<text x="663.0" y="394" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="middle" >OpenWrt</text>
<text x="663.0" y="413" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="middle" >timer in RAM</text>
</svg>